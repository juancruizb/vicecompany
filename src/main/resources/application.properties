spring.application.name=vicecompany

# Los datos reales de conexión van en application-local.properties (raíz del proyecto),
# que Git ignora. Copiar application-local.properties.example y completarlo.
spring.config.import=optional:file:./application-local.properties

# Base de datos de ServiceDesk Plus (SQL Server). Valores por defecto sin credenciales;
# la conexión real se abre recién al consultar, así que la app arranca sin la base.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=servicedesk;encrypt=true;trustServerCertificate=true
spring.datasource.username=
spring.datasource.password=

# Dirección web de ServiceDesk Plus, para los enlaces a tickets y usuarios.
vice.servicedesk.url=https://localhost

# Interruptor de escritura. En false (por defecto) la app es de solo lectura: no muestra
# los botones de sincronizar y rechaza cualquier POST de sincronización.
vice.sincronizacion.habilitada=false

# Sincronización automática (reemplaza al JSP). Formato cron de Spring:
# segundo minuto hora día mes día-semana. "0 0 * * * *" = cada hora en punto.
# "-" = apagada (por defecto). Además requiere vice.sincronizacion.habilitada=true.
vice.sincronizacion.cron=-
